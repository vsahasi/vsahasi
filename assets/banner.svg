      <text x="50" y="196" fill="#34d399">&#8250;</text>
      <text x="66" y="196" opacity="1">I build AI systems end to end<tspan fill="#34d399" dx="4">&#9615;<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.30;0.34;0.96;0.98;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="66" y="196" opacity="0">retrieval &#183; evals &#183; agents &#183; multimodal ML<tspan fill="#34d399" dx="4">&#9615;<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.36;0.63;0.67;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="66" y="196" opacity="0">shipped as full apps, with eval numbers attached<tspan fill="#34d399" dx="4">&#9615;<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.69;0.96;0.98;1" dur="9s" repeatCount="indefinite"/></text>
